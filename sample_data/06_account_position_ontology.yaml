# Generated Apache Ossie ontology (concepts + mappings)
# Spec: https://github.com/apache/ossie/blob/main/ontology/ontology.md
# yaml-language-server: $schema=./ontology.json
version: 0.2.0.dev0
name: account_position_model_ontology
description: Investment account and position semantic model
ontology:
- concept: ClientId
  type: ValueType
  extends:
  - Decimal
  description: Unique surrogate identifier for a client or household.
- concept: ClientName
  type: ValueType
  extends:
  - String
  description: Legal name of the client or household.
- concept: ClientType
  type: ValueType
  extends:
  - String
  description: Classification of the client, e.g. Individual or Institutional.
- concept: TaxId
  type: ValueType
  extends:
  - String
  description: Government tax identifier (e.g. SSN/EIN) associated with the client.
- concept: OnboardingDate
  type: ValueType
  extends:
  - Date
  description: Date the client relationship was established.
- concept: RiskProfile
  type: ValueType
  extends:
  - String
  description: Client's stated investment risk tolerance.
- concept: CountryCode
  type: ValueType
  extends:
  - String
  description: ISO country code of the client's residence.
- concept: AccountId
  type: ValueType
  extends:
  - Decimal
  description: Unique surrogate identifier for an investment account.
- concept: AccountNumber
  type: ValueType
  extends:
  - String
  description: Business/customer-facing account number.
- concept: AccountType
  type: ValueType
  extends:
  - String
  description: Account wrapper type, e.g. Brokerage, IRA, 401k, Trust.
- concept: AccountStatus
  type: ValueType
  extends:
  - String
  description: Current lifecycle status of the account.
- concept: OpenDate
  type: ValueType
  extends:
  - Date
  description: Date the account was opened.
- concept: CloseDate
  type: ValueType
  extends:
  - Date
  description: Date the account was closed, if applicable.
- concept: BaseCurrency
  type: ValueType
  extends:
  - String
  description: ISO currency code the account is denominated in.
- concept: CustodianName
  type: ValueType
  extends:
  - String
  description: Name of the custodian holding the account's assets.
- concept: AdvisorName
  type: ValueType
  extends:
  - String
  description: Name of the financial advisor servicing the account.
- concept: SecurityId
  type: ValueType
  extends:
  - Decimal
  description: Unique surrogate identifier for a security/instrument.
- concept: SecuritySymbol
  type: ValueType
  extends:
  - String
  description: Exchange ticker symbol for the security.
- concept: Cusip
  type: ValueType
  extends:
  - String
  description: CUSIP identifier for the security.
- concept: SecurityName
  type: ValueType
  extends:
  - String
  description: Full descriptive name of the security.
- concept: SecurityType
  type: ValueType
  extends:
  - String
  description: Instrument type, e.g. Equity, Bond, ETF, Mutual Fund, Cash.
- concept: AssetClass
  type: ValueType
  extends:
  - String
  description: Broad asset class grouping for the security.
- concept: Sector
  type: ValueType
  extends:
  - String
  description: Industry sector classification of the issuer.
- concept: Currency
  type: ValueType
  extends:
  - String
  description: ISO currency code the security is priced in.
- concept: IssueDate
  type: ValueType
  extends:
  - Date
  description: Date the security was issued.
- concept: DateId
  type: ValueType
  extends:
  - Decimal
  description: Surrogate key for the date, formatted YYYYMMDD.
- concept: CalendarDate
  type: ValueType
  extends:
  - Date
  description: The calendar date value.
- concept: CalendarYear
  type: ValueType
  extends:
  - Decimal
  description: Four-digit calendar year.
- concept: CalendarQuarter
  type: ValueType
  extends:
  - Decimal
  description: Calendar quarter number (1-4).
- concept: CalendarMonth
  type: ValueType
  extends:
  - Decimal
  description: Calendar month number (1-12).
- concept: MonthName
  type: ValueType
  extends:
  - String
  description: Full name of the calendar month.
- concept: DayOfWeekName
  type: ValueType
  extends:
  - String
  description: Full name of the day of week.
- concept: IsMonthEnd
  type: ValueType
  extends:
  - String
  description: Flag indicating whether the date is the last day of the month.
- concept: IsTradingDay
  type: ValueType
  extends:
  - String
  description: Flag indicating whether markets were open on the date.
- concept: AsOfDateId
  type: ValueType
  extends:
  - Decimal
  description: Foreign key to the snapshot date (DIM_DATE).
- concept: Quantity
  type: ValueType
  extends:
  - Decimal
  description: Number of units/shares of the security held.
- concept: MarketPrice
  type: ValueType
  extends:
  - Decimal
  description: Price per unit as of the snapshot date, in local currency.
- concept: MarketValue
  type: ValueType
  extends:
  - Decimal
  description: Total market value of the position (QUANTITY x MARKET_PRICE).
- concept: CostBasis
  type: ValueType
  extends:
  - Decimal
  description: Total cost basis of the position.
- concept: UnrealizedGainLoss
  type: ValueType
  extends:
  - Decimal
  description: MARKET_VALUE minus COST_BASIS.
- concept: LocalCurrency
  type: ValueType
  extends:
  - String
  description: ISO currency code of the monetary amounts on this row.
- concept: PositionSourceSystem
  type: ValueType
  extends:
  - String
  description: System of record that supplied this position record.
- concept: Client
  type: EntityType
  extends:
  - Any
  description: Dimension Table from dataset DIM_CLIENT
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: ClientId
    multiplicity: OneToOne
    verbalizes:
    - '{Client} is identified by {ClientId}'
  - name: client_name
    description: Legal name of the client or household.
    roles:
    - concept: ClientName
    multiplicity: ManyToOne
    verbalizes:
    - '{Client} has {ClientName}'
  - name: client_type
    description: Classification of the client, e.g. Individual or Institutional.
    roles:
    - concept: ClientType
    multiplicity: ManyToOne
    verbalizes:
    - '{Client} has {ClientType}'
  - name: tax
    description: Government tax identifier (e.g. SSN/EIN) associated with the client.
    roles:
    - concept: TaxId
    multiplicity: ManyToOne
    verbalizes:
    - '{Client} has {TaxId}'
  - name: onboarding_date
    description: Date the client relationship was established.
    roles:
    - concept: OnboardingDate
    multiplicity: ManyToOne
    verbalizes:
    - '{Client} has {OnboardingDate}'
  - name: risk_profile
    description: Client's stated investment risk tolerance.
    roles:
    - concept: RiskProfile
    multiplicity: ManyToOne
    verbalizes:
    - '{Client} has {RiskProfile}'
  - name: country_code
    description: ISO country code of the client's residence.
    roles:
    - concept: CountryCode
    multiplicity: ManyToOne
    verbalizes:
    - '{Client} has {CountryCode}'
- concept: Account
  type: EntityType
  extends:
  - Any
  description: Dimension Table from dataset DIM_ACCOUNT
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: AccountId
    multiplicity: OneToOne
    verbalizes:
    - '{Account} is identified by {AccountId}'
  - name: account_number
    description: Business/customer-facing account number.
    roles:
    - concept: AccountNumber
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {AccountNumber}'
  - name: account_type
    description: Account wrapper type, e.g. Brokerage, IRA, 401k, Trust.
    roles:
    - concept: AccountType
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {AccountType}'
  - name: account_status
    description: Current lifecycle status of the account.
    roles:
    - concept: AccountStatus
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {AccountStatus}'
  - name: open_date
    description: Date the account was opened.
    roles:
    - concept: OpenDate
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {OpenDate}'
  - name: close_date
    description: Date the account was closed, if applicable.
    roles:
    - concept: CloseDate
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {CloseDate}'
  - name: base_currency
    description: ISO currency code the account is denominated in.
    roles:
    - concept: BaseCurrency
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {BaseCurrency}'
  - name: custodian_name
    description: Name of the custodian holding the account's assets.
    roles:
    - concept: CustodianName
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {CustodianName}'
  - name: advisor_name
    description: Name of the financial advisor servicing the account.
    roles:
    - concept: AdvisorName
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} has {AdvisorName}'
  - name: owned_by
    roles:
    - concept: Client
    multiplicity: ManyToOne
    verbalizes:
    - '{Account} is owned by {Client}'
- concept: Security
  type: EntityType
  extends:
  - Any
  description: Dimension Table from dataset DIM_SECURITY
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: SecurityId
    multiplicity: OneToOne
    verbalizes:
    - '{Security} is identified by {SecurityId}'
  - name: security_symbol
    description: Exchange ticker symbol for the security.
    roles:
    - concept: SecuritySymbol
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {SecuritySymbol}'
  - name: cusip
    description: CUSIP identifier for the security.
    roles:
    - concept: Cusip
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {Cusip}'
  - name: security_name
    description: Full descriptive name of the security.
    roles:
    - concept: SecurityName
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {SecurityName}'
  - name: security_type
    description: Instrument type, e.g. Equity, Bond, ETF, Mutual Fund, Cash.
    roles:
    - concept: SecurityType
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {SecurityType}'
  - name: asset_class
    description: Broad asset class grouping for the security.
    roles:
    - concept: AssetClass
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {AssetClass}'
  - name: sector
    description: Industry sector classification of the issuer.
    roles:
    - concept: Sector
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {Sector}'
  - name: currency
    description: ISO currency code the security is priced in.
    roles:
    - concept: Currency
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {Currency}'
  - name: issue_date
    description: Date the security was issued.
    roles:
    - concept: IssueDate
    multiplicity: ManyToOne
    verbalizes:
    - '{Security} has {IssueDate}'
- concept: CalendarDay
  type: EntityType
  extends:
  - Any
  description: Dimension Table from dataset DIM_DATE
  identify_by:
  - id
  relationships:
  - name: id
    roles:
    - concept: DateId
    multiplicity: OneToOne
    verbalizes:
    - '{CalendarDay} is identified by {DateId}'
  - name: calendar_date
    description: The calendar date value.
    roles:
    - concept: CalendarDate
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {CalendarDate}'
  - name: calendar_year
    description: Four-digit calendar year.
    roles:
    - concept: CalendarYear
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {CalendarYear}'
  - name: calendar_quarter
    description: Calendar quarter number (1-4).
    roles:
    - concept: CalendarQuarter
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {CalendarQuarter}'
  - name: calendar_month
    description: Calendar month number (1-12).
    roles:
    - concept: CalendarMonth
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {CalendarMonth}'
  - name: month_name
    description: Full name of the calendar month.
    roles:
    - concept: MonthName
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {MonthName}'
  - name: day_of_week_name
    description: Full name of the day of week.
    roles:
    - concept: DayOfWeekName
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {DayOfWeekName}'
  - name: is_month_end
    description: Flag indicating whether the date is the last day of the month.
    roles:
    - concept: IsMonthEnd
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {IsMonthEnd}'
  - name: is_trading_day
    description: Flag indicating whether markets were open on the date.
    roles:
    - concept: IsTradingDay
    multiplicity: ManyToOne
    verbalizes:
    - '{CalendarDay} has {IsTradingDay}'
- concept: Position
  type: EntityType
  extends:
  - Any
  description: Fact Table from dataset FACT_POSITION
  identify_by:
  - account
  - security
  - as_of_date
  relationships:
  - name: account
    roles:
    - concept: AccountId
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {AccountId} as part of its identity'
  - name: security
    roles:
    - concept: SecurityId
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {SecurityId} as part of its identity'
  - name: as_of_date
    roles:
    - concept: AsOfDateId
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {AsOfDateId} as part of its identity'
  - name: quantity
    description: Number of units/shares of the security held.
    roles:
    - concept: Quantity
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {Quantity}'
  - name: market_price
    description: Price per unit as of the snapshot date, in local currency.
    roles:
    - concept: MarketPrice
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {MarketPrice}'
  - name: market_value
    description: Total market value of the position (QUANTITY x MARKET_PRICE).
    roles:
    - concept: MarketValue
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {MarketValue}'
  - name: cost_basis
    description: Total cost basis of the position.
    roles:
    - concept: CostBasis
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {CostBasis}'
  - name: unrealized_gain_loss
    description: MARKET_VALUE minus COST_BASIS.
    roles:
    - concept: UnrealizedGainLoss
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {UnrealizedGainLoss}'
  - name: local_currency
    description: ISO currency code of the monetary amounts on this row.
    roles:
    - concept: LocalCurrency
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {LocalCurrency}'
  - name: position_source_system
    description: System of record that supplied this position record.
    roles:
    - concept: PositionSourceSystem
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} has {PositionSourceSystem}'
  - name: belongs_to_account
    roles:
    - concept: Account
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} belongs to {Account}'
  - name: holds_security
    roles:
    - concept: Security
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} holds {Security}'
  - name: as_of
    roles:
    - concept: CalendarDay
    multiplicity: ManyToOne
    verbalizes:
    - '{Position} is as of {CalendarDay}'
ontology_mappings:
- name: account_position_model_logical_map
  description: Maps semantic model `account_position_model` datasets/fields onto ontology concepts.
  semantic_model:
    name: account_position_model
    description: Investment account and position semantic model
    datasets:
    - name: DIM_CLIENT
      source: WEALTH_DB.PUBLIC.DIM_CLIENT
      primary_key:
      - CLIENT_ID
      fields:
      - name: CLIENT_ID
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: CLIENT_ID
        datatype: Decimal
        description: Unique surrogate identifier for a client or household.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(10)", "size": "10", "column_position": 1, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column CLNT_SK.", "source_column_name": "CLNT_SK", "primary_key_name": "PK_DIM_CLIENT"}'
      - name: CLIENT_NAME
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: CLIENT_NAME
        datatype: String
        description: Legal name of the client or household.
        ai_context:
          synonyms:
          - client name
          - customer name
          - household name
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(200)", "size": "200", "column_position": 2, "is_nullable":
            false, "contains_pii": true, "description_from_source_system": "Documented in the source warehouse
            as column CLNT_NM.", "source_column_name": "CLNT_NM"}'
      - name: CLIENT_TYPE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: CLIENT_TYPE
        datatype: String
        description: Classification of the client, e.g. Individual or Institutional.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(20)", "size": "20", "column_position": 3, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column CLNT_TYP_CD.", "source_column_name": "CLNT_TYP_CD"}'
      - name: TAX_ID
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: TAX_ID
        datatype: String
        description: Government tax identifier (e.g. SSN/EIN) associated with the client.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(20)", "size": "20", "column_position": 4, "is_nullable":
            true, "contains_pii": true, "description_from_source_system": "Documented in the source warehouse
            as column TAX_ID_NBR.", "source_column_name": "TAX_ID_NBR"}'
      - name: ONBOARDING_DATE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: ONBOARDING_DATE
        datatype: Date
        description: Date the client relationship was established.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "DATE", "column_position": 5, "is_nullable": false, "contains_pii":
            false, "description_from_source_system": "Documented in the source warehouse as column ONBRD_DT.",
            "source_column_name": "ONBRD_DT"}'
      - name: RISK_PROFILE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: RISK_PROFILE
        datatype: String
        description: Client's stated investment risk tolerance.
        ai_context:
          synonyms:
          - risk tolerance
          - investor risk level
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(20)", "size": "20", "column_position": 6, "is_nullable":
            true, "contains_pii": false, "description_from_source_system": "Documented in the source warehouse
            as column RISK_PRFL_CD.", "source_column_name": "RISK_PRFL_CD"}'
      - name: COUNTRY_CODE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: COUNTRY_CODE
        datatype: String
        description: ISO country code of the client's residence.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(3)", "size": "3", "column_position": 7, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column CNTRY_CD.", "source_column_name": "CNTRY_CD"}'
      custom_extensions:
      - vendor_name: COMMON
        data: '{"asset_type": "Dimension Table", "pii_columns": ["CLIENT_NAME", "TAX_ID"]}'
    - name: DIM_ACCOUNT
      source: WEALTH_DB.PUBLIC.DIM_ACCOUNT
      primary_key:
      - ACCOUNT_ID
      fields:
      - name: ACCOUNT_ID
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: ACCOUNT_ID
        datatype: Decimal
        description: Unique surrogate identifier for an investment account.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(10)", "size": "10", "column_position": 1, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column ACCT_SK.", "source_column_name": "ACCT_SK", "primary_key_name": "PK_DIM_ACCOUNT"}'
      - name: ACCOUNT_NUMBER
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: ACCOUNT_NUMBER
        datatype: String
        description: Business/customer-facing account number.
        ai_context:
          synonyms:
          - account number
          - acct no
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(30)", "size": "30", "column_position": 2, "is_nullable":
            false, "contains_pii": true, "description_from_source_system": "Documented in the source warehouse
            as column ACCT_NBR.", "source_column_name": "ACCT_NBR"}'
        - vendor_name: COMMON
          data: '{"masking_policy": "MASK_ACCOUNT_NUMBER"}'
      - name: CLIENT_ID
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: CLIENT_ID
        datatype: Decimal
        description: Foreign key to the owning client (DIM_CLIENT).
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(10)", "size": "10", "column_position": 3, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column CLNT_SK.", "source_column_name": "CLNT_SK"}'
      - name: ACCOUNT_TYPE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: ACCOUNT_TYPE
        datatype: String
        description: Account wrapper type, e.g. Brokerage, IRA, 401k, Trust.
        ai_context:
          synonyms:
          - account category
          - wrapper type
          - plan type
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(30)", "size": "30", "column_position": 4, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column ACCT_TYP_CD.", "source_column_name": "ACCT_TYP_CD"}'
      - name: ACCOUNT_STATUS
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: ACCOUNT_STATUS
        datatype: String
        description: Current lifecycle status of the account.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(15)", "size": "15", "column_position": 5, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column ACCT_STS_CD.", "source_column_name": "ACCT_STS_CD"}'
      - name: OPEN_DATE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: OPEN_DATE
        datatype: Date
        description: Date the account was opened.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "DATE", "column_position": 6, "is_nullable": false, "contains_pii":
            false, "description_from_source_system": "Documented in the source warehouse as column OPEN_DT.",
            "source_column_name": "OPEN_DT"}'
      - name: CLOSE_DATE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: CLOSE_DATE
        datatype: Date
        description: Date the account was closed, if applicable.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "DATE", "column_position": 7, "is_nullable": true, "contains_pii":
            false, "description_from_source_system": "Documented in the source warehouse as column CLOSE_DT.",
            "source_column_name": "CLOSE_DT"}'
      - name: BASE_CURRENCY
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: BASE_CURRENCY
        datatype: String
        description: ISO currency code the account is denominated in.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(3)", "size": "3", "column_position": 8, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
