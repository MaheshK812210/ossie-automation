    - name: FACT_POSITION
      source: WEALTH_DB.PUBLIC.FACT_POSITION
      primary_key:
      - ACCOUNT_ID
      - SECURITY_ID
      - AS_OF_DATE_ID
      fields:
      - name: ACCOUNT_ID
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: ACCOUNT_ID
        datatype: Decimal
        description: Foreign key to the account holding this position (DIM_ACCOUNT).
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(10)", "size": "10", "column_position": 1, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column ACCT_SK.", "source_column_name": "ACCT_SK", "primary_key_name": "PK_FACT_POSITION"}'
      - name: SECURITY_ID
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: SECURITY_ID
        datatype: Decimal
        description: Foreign key to the security held in this position (DIM_SECURITY).
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(10)", "size": "10", "column_position": 2, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column SEC_SK.", "source_column_name": "SEC_SK", "primary_key_name": "PK_FACT_POSITION"}'
      - name: AS_OF_DATE_ID
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: AS_OF_DATE_ID
        datatype: Decimal
        description: Foreign key to the snapshot date (DIM_DATE).
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(8)", "size": "8", "column_position": 3, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column AS_OF_DT_SK.", "source_column_name": "AS_OF_DT_SK", "primary_key_name":
            "PK_FACT_POSITION"}'
      - name: QUANTITY
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: QUANTITY
        datatype: Decimal
        description: Number of units/shares of the security held.
        ai_context:
          synonyms:
          - units held
          - shares held
          - position size
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(18,4)", "size": "18,4", "column_position": 4, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column QTY.", "source_column_name": "QTY"}'
      - name: MARKET_PRICE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: MARKET_PRICE
        datatype: Decimal
        description: Price per unit as of the snapshot date, in local currency.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(18,6)", "size": "18,6", "column_position": 5, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column MKT_PX.", "source_column_name": "MKT_PX"}'
      - name: MARKET_VALUE
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: MARKET_VALUE
        datatype: Decimal
        description: Total market value of the position (QUANTITY x MARKET_PRICE).
        ai_context:
          synonyms:
          - position value
          - holding value
          - market val
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(18,2)", "size": "18,2", "column_position": 6, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column MKT_VAL_AMT.", "source_column_name": "MKT_VAL_AMT"}'
      - name: COST_BASIS
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: COST_BASIS
        datatype: Decimal
        description: Total cost basis of the position.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(18,2)", "size": "18,2", "column_position": 7, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column CST_BASIS_AMT.", "source_column_name": "CST_BASIS_AMT"}'
      - name: UNREALIZED_GAIN_LOSS
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: UNREALIZED_GAIN_LOSS
        datatype: Decimal
        description: MARKET_VALUE minus COST_BASIS.
        ai_context:
          synonyms:
          - unrealized P&L
          - paper gain
          - paper loss
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "NUMBER(18,2)", "size": "18,2", "column_position": 8, "is_nullable":
            true, "contains_pii": false, "description_from_source_system": "Documented in the source warehouse
            as column UNRLZD_GL_AMT.", "source_column_name": "UNRLZD_GL_AMT"}'
      - name: LOCAL_CURRENCY
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: LOCAL_CURRENCY
        datatype: String
        description: ISO currency code of the monetary amounts on this row.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(3)", "size": "3", "column_position": 9, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column LCL_CCY_CD.", "source_column_name": "LCL_CCY_CD"}'
      - name: POSITION_SOURCE_SYSTEM
        expression:
          dialects:
          - dialect: ANSI_SQL
            expression: POSITION_SOURCE_SYSTEM
        datatype: String
        description: System of record that supplied this position record.
        custom_extensions:
        - vendor_name: COMMON
          data: '{"technical_data_type": "VARCHAR2(30)", "size": "30", "column_position": 10, "is_nullable":
            false, "contains_pii": false, "description_from_source_system": "Documented in the source
            warehouse as column SRC_SYS_CD.", "source_column_name": "SRC_SYS_CD"}'
      custom_extensions:
      - vendor_name: COMMON
        data: '{"asset_type": "Fact Table"}'
      - vendor_name: SNOWFLAKE
        data: '{"clustering_keys": ["AS_OF_DATE_ID", "ACCOUNT_ID"]}'
    relationships:
    - name: FACT_POSITION_TO_ACCOUNT
      from: FACT_POSITION
      to: DIM_ACCOUNT
      from_columns:
      - ACCOUNT_ID
      to_columns:
      - ACCOUNT_ID
      ai_context:
        instructions: Each position belongs to exactly one account.
        synonyms:
        - Many-to-One
      custom_extensions:
      - vendor_name: COMMON
        data: '{"relationship_type": "Many-to-One"}'
    - name: FACT_POSITION_TO_SECURITY
      from: FACT_POSITION
      to: DIM_SECURITY
      from_columns:
      - SECURITY_ID
      to_columns:
      - SECURITY_ID
      ai_context:
        instructions: Each position holds exactly one security.
        synonyms:
        - Many-to-One
      custom_extensions:
      - vendor_name: COMMON
        data: '{"relationship_type": "Many-to-One"}'
    - name: FACT_POSITION_TO_DATE
      from: FACT_POSITION
      to: DIM_DATE
      from_columns:
      - AS_OF_DATE_ID
      to_columns:
      - DATE_ID
      ai_context:
        instructions: Each position snapshot is tied to exactly one calendar date.
        synonyms:
        - Many-to-One
      custom_extensions:
      - vendor_name: COMMON
        data: '{"relationship_type": "Many-to-One"}'
    - name: ACCOUNT_TO_CLIENT
      from: DIM_ACCOUNT
      to: DIM_CLIENT
      from_columns:
      - CLIENT_ID
      to_columns:
      - CLIENT_ID
      ai_context:
        instructions: Each account is owned by exactly one client/household.
        synonyms:
        - Many-to-One
      custom_extensions:
      - vendor_name: COMMON
        data: '{"relationship_type": "Many-to-One"}'
    metrics:
    - name: total_market_value
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SUM(FACT_POSITION.MARKET_VALUE)
      description: Total market value of all positions across accounts.
      datatype: Decimal
    - name: total_cost_basis
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SUM(FACT_POSITION.COST_BASIS)
      description: Total cost basis of all positions.
      datatype: Decimal
    - name: total_unrealized_gain_loss
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SUM(FACT_POSITION.UNREALIZED_GAIN_LOSS)
      description: Total unrealized gain or loss across all positions.
      datatype: Decimal
    - name: distinct_securities_held
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT FACT_POSITION.SECURITY_ID)
      description: Number of distinct securities held across all positions.
      datatype: Integer
    - name: average_position_value
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: AVG(FACT_POSITION.MARKET_VALUE)
      description: Average market value per position.
      datatype: Decimal
